# Runnable Azure DevOps counterpart to the verified GitHub workflow.
# Requires an Azure DevOps project/repository connection; not deployed automatically.
trigger:
  - main
pr:
  - main
pool:
  vmImage: ubuntu-latest
variables:
  buildConfiguration: Release
steps:
  - checkout: self
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: 10.0.x
  - task: NodeTool@0
    inputs:
      versionSpec: 22.x
  - script: dotnet test tests/ServiceConnect.Tests -c $(buildConfiguration)
    displayName: API, workflow and SQLite migration tests
  - bash: |
      docker run -d --name service-connect-ci-sql -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=CI_Disposable_Password_123! -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
      for attempt in $(seq 1 40); do
        if docker exec service-connect-ci-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CI_Disposable_Password_123!' -C -Q 'SELECT 1'; then exit 0; fi
        sleep 3
      done
      exit 1
    displayName: Start disposable SQL Server and wait for readiness
  - script: dotnet test tests/ServiceConnect.Tests -c $(buildConfiguration)
    displayName: SQL Server integration, schema upgrade and concurrency tests
    env:
      TEST_SQLSERVER: 'Server=localhost,1433;User Id=sa;Password=CI_Disposable_Password_123!;Encrypt=True;TrustServerCertificate=True'
  - script: dotnet publish backend/ServiceConnect.Api -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api
    displayName: Publish API artifact
  - script: |
      npm ci
      npm test
      npm run build
      npx playwright install --with-deps chromium
      npm run test:e2e
    workingDirectory: frontend
    displayName: Frontend, full-stack browser and axe accessibility checks
  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: frontend/playwright-report
      artifact: accessibility-browser-report
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/api
      artifact: service-connect-api
  - bash: docker rm -f service-connect-ci-sql
    displayName: Remove disposable SQL Server
    condition: always()
